<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call Operating Hours</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-secondary: #f5f5f5;
    --border: #e0e0e0;
    --border-light: #ebebeb;
    --text: #1a1a1a;
    --text-secondary: #555;
    --text-tertiary: #888;
    --radius: 10px;
    --radius-sm: 6px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --bg-secondary: #252525;
      --border: #333;
      --border-light: #2c2c2c;
      --text: #f0f0f0;
      --text-secondary: #aaa;
      --text-tertiary: #666;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    line-height: 1.6;
    padding: 20px;
  }
  .container { max-width: 1400px; margin: 0 auto; }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .header h1 { font-size: 28px; font-weight: 600; color: #f0f6fc; }

  .now-badge {
    font-size: 14px;
    padding: 4px 12px;
    border-radius: 999px;
    background: #252525;
    border: 1px solid #333;
    color: #8b949e;
  }

  .last-updated {
    font-size: 13px;
    color: #8b949e;
  }

  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    align-items: center;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #c9d1d9; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot.green  { background: #3fb950; }
  .dot.yellow { background: #d29922; }
  .dot.grey   { background: #484f58; }

  .section { margin-bottom: 24px; }
  .section-label {
    font-size: 20px;
    font-weight: 500;
    color: #f0f6fc;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-flag { font-size: 20px; line-height: 1; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 9px;
  }
  .grid-row {
    display: flex;
    flex-wrap: nowrap;
    gap: 9px;
    overflow-x: auto;
  }
  .grid-row .card {
    flex: 1 1 0;
    min-width: 220px;
  }

  .card {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 16px;
    transition: border-color 0.2s, background 0.2s, opacity 0.2s;
  }
  .card.green  { border-color: #3fb950; background: rgba(63,185,80,0.1); }
  .card.yellow { border-color: #d29922; background: rgba(210,153,34,0.1); }
  .card.grey   { opacity: 0.5; }

  .city   { font-size: 14px; font-weight: 600; color: #f0f6fc; line-height: 1.3; }
  .tz-sub { font-size: 13px; color: #8b949e; margin-top: 2px; }

  .time-now {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.5px;
    margin: 5px 0 4px;
    color: #f0f6fc;
  }

  .badge-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .badge {
    font-size: 12px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.both         { background: #238636; color: #f0f6fc; }
  .badge.inbound-only { background: #9e6a03; color: #f0f6fc; }
  .badge.none         { background: #333; color: #8b949e; }
  .badge.weekend      { background: #333; color: #8b949e; }

  .inbound-row   { display: flex; gap: 6px; align-items: baseline; margin-top: 4px; }
  .inbound-label { font-size: 13px; color: #8b949e; }
  .inbound-val   { font-size: 13px; color: #c9d1d9; }
  .date-row      { font-size: 18px; font-weight: 600; letter-spacing: -0.5px; color: #8b949e; }
</style>
</head>
<body>
<div class="container">

<div class="header">
  <h1>Call Operating Hours</h1>
  <span class="now-badge" id="utc-now"></span>
  <span class="last-updated" id="last-updated"></span>
</div>

<div class="legend">
  <div class="legend-item"><div class="dot green"></div>Outbound + inbound</div>
  <div class="legend-item"><div class="dot yellow"></div>Inbound only</div>
  <div class="legend-item"><div class="dot grey"></div>No calls</div>
</div>

<div id="sections"></div>

</div>

<script>
const MEL_TZ = "Australia/Melbourne";
const ET_TZ  = "America/New_York";
const MEL_OPEN = 8*60, MEL_CLOSE = 20*60;
const USA_OPEN_ET = 8*60, USA_CLOSE_ET = 23*60;

function getParts(tz) {
  const p = {};
  new Intl.DateTimeFormat("en-US", {
    timeZone: tz, hour: "2-digit", minute: "2-digit",
    hour12: false, weekday: "short", month: "short", day: "numeric"
  }).formatToParts(new Date()).forEach(x => p[x.type] = x.value);
  return p;
}
function localMins(tz) { const p = getParts(tz); return parseInt(p.hour)*60 + parseInt(p.minute); }
function isWeekend(tz) { const d = getParts(tz).weekday; return d === "Sat" || d === "Sun"; }
function inWin(cur, a, b) { if (a < b) return cur >= a && cur < b; return cur >= a || cur < b; }
function melWinActive()  { return inWin(localMins(MEL_TZ), MEL_OPEN, MEL_CLOSE); }
function usaWinActive()  { return inWin(localMins(ET_TZ), USA_OPEN_ET, USA_CLOSE_ET); }
function operatingWin()  { return melWinActive() || usaWinActive(); }
function outboundOpen(tz) {
  if (isWeekend(tz)) return false;
  if (!operatingWin()) return false;
  return inWin(localMins(tz), 8*60, 20*60);
}
function callStatus(tz) {
  if (outboundOpen(tz)) return "green";
  if (operatingWin())   return "yellow";
  return "grey";
}

function tzOffsetMins(tz) {
  const d = new Date();
  return Math.round((new Date(d.toLocaleString("en-US", {timeZone: tz})) - d) / 60000);
}
function translateWindow(open, close, srcTz, tgtTz) {
  const diff = tzOffsetMins(tgtTz) - tzOffsetMins(srcTz);
  return {
    open:  ((open  + diff) % 1440 + 1440) % 1440,
    close: ((close + diff) % 1440 + 1440) % 1440
  };
}
function mergeWindows(w1, w2) {
  const active = new Uint8Array(1440);
  function mark(w) {
    if (w.open < w.close) { for (let i = w.open; i < w.close; i++) active[i] = 1; }
    else { for (let i = w.open; i < 1440; i++) active[i] = 1; for (let i = 0; i < w.close; i++) active[i] = 1; }
  }
  mark(w1); mark(w2);
  const ranges = [];
  let start = null;
  for (let i = 0; i < 1440; i++) {
    if (active[i] && start === null) start = i;
    if (!active[i] && start !== null) { ranges.push({open: start, close: i}); start = null; }
  }
  if (start !== null) ranges.push({open: start, close: 1440});
  if (ranges.length > 1 && active[0] && active[1439]) {
    const first = ranges.shift();
    const last  = ranges.pop();
    ranges.unshift({open: last.open, close: first.close + (1440 - last.open)});
  }
  return ranges;
}
function minsToFmt(m) {
  m = ((m % 1440) + 1440) % 1440;
  const h = Math.floor(m / 60) % 24, mn = m % 60;
  const ap = h < 12 ? "am" : "pm";
  const hh = h % 12 === 0 ? 12 : h % 12;
  return `${hh}:${String(mn).padStart(2,"0")}${ap}`;
}
function fmt(h, m) {
  const ap = h < 12 ? "am" : "pm";
  const hh = h % 12 === 0 ? 12 : h % 12;
  return `${hh}:${String(m).padStart(2,"0")}${ap}`;
}
function getMergedInbound(tz) {
  const mw = translateWindow(MEL_OPEN, MEL_CLOSE, MEL_TZ, tz);
  const uw = translateWindow(USA_OPEN_ET, USA_CLOSE_ET, ET_TZ, tz);
  return mergeWindows(mw, uw);
}

const ZONES = [
  {label:"New Zealand",          sub:"NZST / NZDT",            tz:"Pacific/Auckland",       region:"NZ"},
  {label:"VIC, NSW, TAS, ACT",   sub:"AEDT / AEST",            tz:"Australia/Sydney",        region:"AU"},
  {label:"QLD",                  sub:"AEST (no DST)",           tz:"Australia/Brisbane",      region:"AU"},
  {label:"SA",                   sub:"ACDT / ACST",             tz:"Australia/Adelaide",      region:"AU"},
  {label:"NT",                   sub:"ACST (no DST)",           tz:"Australia/Darwin",        region:"AU"},
  {label:"WA",                   sub:"AWST",                    tz:"Australia/Perth",         region:"AU"},
  {label:"South Africa",         sub:"SAST",                    tz:"Africa/Johannesburg",     region:"ZA"},
  {label:"Eastern",              sub:"ET — NY, FL, GA, OH, PA…",tz:"America/New_York",        region:"US"},
  {label:"Central",              sub:"CT — TX, IL, MN, MO, LA…",tz:"America/Chicago",         region:"US"},
  {label:"Mountain",             sub:"MT — CO, UT, WY, NM, ID…",tz:"America/Denver",          region:"US"},
  {label:"Arizona",              sub:"MT no DST — AZ",          tz:"America/Phoenix",         region:"US"},
  {label:"Pacific",              sub:"PT — CA, WA, OR, NV",     tz:"America/Los_Angeles",     region:"US"},
  {label:"Alaska",               sub:"AKT — AK",                tz:"America/Anchorage",       region:"US"},
  {label:"Hawaii",               sub:"HST — HI",                tz:"Pacific/Honolulu",        region:"US"},
];

const GROUP_META = {
  NZ: {label:"New Zealand",    flag:"🇳🇿"},
  AU: {label:"Australia",      flag:"🇦🇺"},
  ZA: {label:"South Africa",   flag:"🇿🇦"},
  US: {label:"United States",  flag:"🇺🇸"},
};

function makeCard(z) {
  const p      = getParts(z.tz);
  const h      = p.hour === "24" ? "00" : p.hour;
  const timeStr = fmt(parseInt(h) % 24, parseInt(p.minute));
  const status  = callStatus(z.tz);
  const wknd    = isWeekend(z.tz);
  const ranges  = getMergedInbound(z.tz);

  let badge = "";
  if (status === "green") {
    badge = `<span class="badge both">↑↓ outbound + inbound</span>`;
  } else if (status === "yellow") {
    badge = `<span class="badge inbound-only">↓ inbound only</span>`;
    if (wknd) badge += `<span class="badge weekend">weekend</span>`;
  } else {
    badge = `<span class="badge none">no calls</span>`;
  }


  const card = document.createElement("div");
  card.className = `card ${status}`;
  const inboundRanges = ranges.length
    ? ranges.map(r => `${minsToFmt(r.open)} – ${minsToFmt(r.close)}`).join(", ")
    : "—";

  const cityHtml = (z.region === "NZ" || z.region === "ZA") ? "" : `<div class="city">${z.label}</div>`;

  card.innerHTML = `
    ${cityHtml}
    <div class="tz-sub">${z.sub}</div>
    <div class="time-now">${timeStr} <span class="date-row">${p.weekday} ${p.month} ${p.day}</span></div>
    <div class="badge-row">${badge}</div>
    <div class="inbound-row"><span class="inbound-label">Call in (local time)</span><span class="inbound-val">${inboundRanges}</span></div>
  `;
  return card;
}

const HIDDEN_US_ZONES = new Set(["America/Denver", "America/Phoenix", "America/Anchorage"]);

function render() {
  const sections = document.getElementById("sections");
  sections.innerHTML = "";
  ["AU","US","NZ","ZA"].forEach(r => {
    let zones = ZONES.filter(z => z.region === r);
    if (r === "US") zones = zones.filter(z => !HIDDEN_US_ZONES.has(z.tz));
    if (!zones.length) return;
    const sec = document.createElement("div"); sec.className = "section";
    const lbl = document.createElement("div"); lbl.className = "section-label";
    const meta = GROUP_META[r];
    lbl.innerHTML = `<span class="section-flag">${meta.flag}</span>${meta.label}`;
    sec.appendChild(lbl);
    const grid = document.createElement("div");
    grid.className = r === "AU" ? "grid-row" : "grid";
    zones.forEach(z => grid.appendChild(makeCard(z)));
    sec.appendChild(grid);
    sections.appendChild(sec);
  });
}

function updateUtc() {
  const now = new Date();
  document.getElementById("utc-now").textContent = "UTC " + now.toISOString().slice(11,16);
  document.getElementById("last-updated").textContent = "Updated " + now.toLocaleTimeString();
}

// Initial render
render(); updateUtc();

// Refresh every 10 seconds — updates times, open/closed status, and inbound windows
setInterval(() => { render(); updateUtc(); }, 10000);
</script>
</body>
</html>
