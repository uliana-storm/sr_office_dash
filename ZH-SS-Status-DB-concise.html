<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Monitor | Zero Hash + Sumsub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      line-height: 1.6;
      padding: 20px;
    }
    .container { width: 100%; margin: 0 auto; }
    h2 { font-size: 80px; font-weight: 600; margin: 32px 0 24px; color: #f0f6fc; }

    /* Summary Tiles */
    .summary-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-bottom: 32px;
    }
    .summary-grid > div {
      flex: 1 1 45%;
      min-width: 400px;
    }
    .summary-tile {
      border-radius: 16px;
      padding: 40px;
      transition: all 0.2s;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      min-height: 400px;
    }
    .summary-tile:hover { transform: translateY(-2px); }
    .summary-tile.operational {
      background: #23863626;
      border: 2px solid #3fb950;
    }
    .summary-tile.degraded {
      background: #9e6a0326;
      border: 2px solid #d29922;
    }
    .summary-tile.outage {
      background: #da363326;
      border: 2px solid #f85149;
    }
    .summary-tile.maintenance {
      background: #8957e526;
      border: 2px solid #a371f7;
    }
    .summary-tile-logo-only {
      max-width: 600px;
      max-height: 360px;
      object-fit: contain;
      border-radius: 8px;
    }

    .section { margin-bottom: 24px; }

    .alert-box {
      background: #da363326;
      border: 2px solid #f85149;
      border-left: 8px solid #f85149;
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
    }
    .alert-box.warning {
      background: #9e6a0326;
      border-color: #d29922;
      border-left-color: #d29922;
    }
    .alert-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 16px;
    }
    .alert-service {
      font-size: 48px;
      font-weight: 600;
      color: #f0f6fc;
    }
    .alert-status {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px 20px;
      border-radius: 16px;
      font-size: 32px;
      font-weight: 500;
    }
    .alert-status::before {
      content: '';
      width: 20px;
      height: 20px;
      border-radius: 50%;
    }
    .alert-status.operational { background: transparent; border: 1px solid #3fb950; color: #3fb950; }
    .alert-status.operational::before { background: #3fb950; }
    .alert-status.degraded { background: transparent; border: 1px solid #d29922; color: #d29922; }
    .alert-status.degraded::before { background: #d29922; }
    .alert-status.outage { background: transparent; border: 1px solid #f85149; color: #f85149; }
    .alert-status.outage::before { background: #f85149; }
    .alert-time {
      font-size: 36px;
      color: #8b949e;
    }
    .alert-message {
      font-size: 40px;
      color: #c9d1d9;
    }

    .no-alerts {
      color: #8b949e;
      font-style: italic;
      padding: 16px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .summary-grid { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="summary-grid">
      <div id="zh-summary" class="summary-tile operational" data-service="zerohash" data-status="operational">
        <img src="logos/zerohash.png" alt="Zero Hash" class="summary-tile-logo-only">
      </div>

      <div id="ss-summary" class="summary-tile operational" data-service="sumsub" data-status="operational">
        <img src="logos/sumsub.png" alt="Sumsub" class="summary-tile-logo-only">
      </div>
    </div>

    <div class="section" id="alerts-section">
      <h2>Unresolved Alerts</h2>
      <div id="alerts-container"></div>
    </div>
  </div>

  <script>
    // Status data - fetched live from status pages (not cached)
    // Only logo images are cached by browser; statuses always fresh
    const ZEROSHASH_STATUS_URL = 'https://status.zerohash.com/api/v2/summary.json';
    const SUMSUB_STATUS_URL = 'https://status.sumsub.com/api/v2/summary.json';

    let ZEROHASH_COMPONENTS = [];
    let SUMSUB_SGP = [];
    let RECENT_ALERTS = [];

    // Track when each service became non-operational
    const serviceIssueStartTimes = {};

    let timerInterval;

    function getTileClass(status) {
      if (status === 'Operational' || status === 'Resolved') return 'operational';
      if (status === 'Degraded Performance' || status === 'Monitoring') return 'degraded';
      if (status === 'Partial Outage' || status === 'Unresolved') return 'outage';
      if (status === 'Major Outage') return 'outage';
      return 'maintenance';
    }

    function getAlertClass(status) {
      if (status === 'Operational' || status === 'Resolved') return 'operational';
      if (status === 'Degraded Performance' || status === 'Monitoring') return 'degraded';
      if (status === 'Partial Outage' || status === 'Unresolved') return 'outage';
      if (status === 'Major Outage') return 'outage';
      return 'maintenance';
    }

    function countIssues(items) {
      return items.filter(i => i.status !== 'Operational' && i.status !== 'Resolved').length;
    }

    function formatDuration(ms) {
      const seconds = Math.floor(ms / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);

      if (days > 0) return `${days}d ${hours % 24}h ${minutes % 60}m`;
      if (hours > 0) return `${hours}h ${minutes % 60}m ${seconds % 60}s`;
      if (minutes > 0) return `${minutes}m ${seconds % 60}s`;
      return `${seconds}s`;
    }

    function getServiceStatus(components) {
      const issueCount = countIssues(components);
      if (issueCount === 0) return { status: 'Operational', class: 'operational' };

      // Find the worst status
      const statuses = components.map(c => c.status);
      if (statuses.includes('Major Outage')) return { status: 'Major Outage', class: 'outage' };
      if (statuses.includes('Partial Outage') || statuses.includes('Unresolved')) return { status: 'Partial Outage', class: 'outage' };
      if (statuses.includes('Degraded Performance') || statuses.includes('Monitoring')) return { status: 'Degraded Performance', class: 'degraded' };
      return { status: 'Issue Detected', class: 'outage' };
    }

    function updateServiceTile(serviceId, components) {
      const tile = document.getElementById(serviceId);
      const statusInfo = getServiceStatus(components);
      const issueCount = countIssues(components);

      // Update tile class and status
      tile.className = `summary-tile ${statusInfo.class}`;
      tile.setAttribute('data-status', statusInfo.status.toLowerCase());

      if (issueCount === 0) {
        delete serviceIssueStartTimes[serviceId];
      } else {
        // Start timer if not already tracking
        if (!serviceIssueStartTimes[serviceId]) {
          serviceIssueStartTimes[serviceId] = Date.now();
        }
      }
    }

    function renderAlert(alert) {
      const alertClass = alert.severity === 'warning' ? 'warning' : '';
      return `<div class="alert-box ${alertClass}">
        <div class="alert-header">
          <span class="alert-service">${alert.service} | ${alert.component}</span>
          <span class="alert-status ${getAlertClass(alert.status)}">${alert.status}</span>
        </div>
        <div class="alert-message">${alert.message}</div>
        <div class="alert-time">${alert.time}</div>
      </div>`;
    }

    function updateTimers() {
      // Timer tracking maintained but no visible display in simplified view
    }

    function render() {
      // Update summary tiles
      updateServiceTile('zh-summary', ZEROHASH_COMPONENTS);
      updateServiceTile('ss-summary', SUMSUB_SGP);

      // Show only unresolved alerts
      const unresolvedAlerts = RECENT_ALERTS.filter(a => a.status !== 'Resolved');
      const alertsContainer = document.getElementById('alerts-container');

      if (unresolvedAlerts.length === 0) {
        alertsContainer.innerHTML = '<div class="no-alerts">No unresolved alerts</div>';
      } else {
        alertsContainer.innerHTML = unresolvedAlerts.map(renderAlert).join('');
      }
    }

    // Fetch fresh status data (not cached)
    async function fetchStatusData() {
      const zhTile = document.getElementById('zh-summary');
      const ssTile = document.getElementById('ss-summary');

      try {
        const [zhRes, ssRes] = await Promise.all([
          fetch(ZEROSHASH_STATUS_URL, { cache: 'no-store' }),
          fetch(SUMSUB_STATUS_URL, { cache: 'no-store' })
        ]);

        if (zhRes.ok) {
          const zhData = await zhRes.json();
          ZEROHASH_COMPONENTS = zhData.components || [];
          RECENT_ALERTS = (zhData.incidents || []).map(i => ({
            id: i.id,
            service: 'Zero Hash',
            component: i.name,
            status: i.status === 'resolved' ? 'Resolved' : 'Unresolved',
            message: i.incident_updates?.[0]?.body || i.name,
            time: i.started_at,
            severity: i.impact === 'none' ? 'success' : 'warning'
          }));
        }

        if (ssRes.ok) {
          const ssData = await ssRes.json();
          SUMSUB_SGP = ssData.components || [];
          const ssIncidents = (ssData.incidents || []).map(i => ({
            id: i.id,
            service: 'Sumsub',
            component: i.name,
            status: i.status === 'resolved' ? 'Resolved' : 'Unresolved',
            message: i.incident_updates?.[0]?.body || i.name,
            time: i.started_at,
            severity: i.impact === 'none' ? 'success' : 'warning'
          }));
          RECENT_ALERTS = [...RECENT_ALERTS, ...ssIncidents];
        }

        render();
      } catch (err) {
        console.error('Failed to fetch status:', err);
        zhTile.className = 'summary-tile degraded';
        ssTile.className = 'summary-tile degraded';
        document.getElementById('alerts-container').innerHTML =
          '<div class="no-alerts">Unable to fetch live status data</div>';
      }
    }

    // Initialize - fetch fresh data, no cache
    fetchStatusData();
    setInterval(fetchStatusData, 60000); // Refresh every minute
    timerInterval = setInterval(updateTimers, 1000);

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      clearInterval(timerInterval);
    });
  </script>
</body>
</html>
